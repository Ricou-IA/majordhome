# supabase/config.toml — Configuration versioning Supabase
# ============================================================================
# P1.6 (2026-05-21) — Versionne la config `verify_jwt` des edge functions
# pour éviter les drifts entre prod (réglée via dashboard Supabase ou MCP
# deploy_edge_function) et le repo. Si une edge est redéployée sans passer
# `verify_jwt` au MCP, la valeur de cette config est appliquée.
#
# Référence : https://supabase.com/docs/guides/functions/secrets#config-toml
# ============================================================================

project_id = "odspcxgafcqxjzrarsqf"

# ============================================================================
# Edge functions — configuration verify_jwt
# ============================================================================

# Webhooks tiers (Svix HMAC / signature custom) : pas de JWT
[functions.resend-webhook]
verify_jwt = false

[functions.mailing-unsubscribe]
verify_jwt = false

[functions.avis-redirect]
verify_jwt = false

# OAuth callbacks Google : pas de JWT (state HMAC validé en interne)
[functions.gsc-oauth-callback]
verify_jwt = false

# Google Calendar OAuth (init + callback dans la même fonction, routée par ?action=).
# ⚠️ Contrairement à gsc-oauth-*, son `state` n'est PAS signé (HMAC absent) et le
# callback interpole `state.org_id` dans un appel `exec_sql` en service_role.
# Fonction récupérée depuis la prod le 2026-08-09, à durcir avant tout onboarding.
[functions.google-calendar-auth]
verify_jwt = false

# Crons N8n / job one-shot — protégés par MDH_CRON_SECRET (P0.2)
[functions.pennylane-sync-cron]
verify_jwt = false

[functions.pennylane-backfill-quotes]
verify_jwt = false

[functions.pennylane-sync-quote-status]
verify_jwt = false

[functions.pennylane-quotes-sweep]
verify_jwt = false

# Voice — protégée par MDH_CRON_SECRET (P0.6)
[functions.voice-extract-fieldreport]
verify_jwt = false

# Scheduler campagnes mailing auto — protégée par MDH_CRON_SECRET (pg_cron 10 min)
[functions.mailing-scheduler]
verify_jwt = false

# GeoGrid scan — protégée par MDH_CRON_SECRET (P0.2-like)
[functions.geogrid-scan]
verify_jwt = false

# Géocodage serveur (balayage 30 min) — protégée par MDH_CRON_SECRET
[functions.geocode-sweep]
verify_jwt = false

# Edges appelées par le frontend authentifié (JWT user)
[functions.pennylane-proxy]
verify_jwt = true

# SMS/WhatsApp transactionnel multi-org (remplace 2 workflows N8N).
# Twilio mutualisé côté plateforme, identité d'expéditeur par org dans
# settings.sms. Appelée par le frontend authentifié.
[functions.sms-send]
verify_jwt = true

# Rappel automatique des RDV d'entretien (cron pg_cron horaire, réglage par org
# settings.sms.rappel_rdv : veille / hebdo / off) — protégée par MDH_CRON_SECRET.
# Même cœur d'envoi que sms-send (_shared/sms.ts).
[functions.sms-rappel-rdv]
verify_jwt = false

# Agent téléphonique (ElevenLabs) — outil verifier_client, appelé pendant l'appel :
# secret partagé MDH_VOICE_AGENT_SECRET (spec 2026-10-04-agent-telephonique-verifier-client).
[functions.agent-verifier-client]
verify_jwt = false

# Agent téléphonique — outils proposer_creneaux / reserver_creneau (même secret partagé).
[functions.agent-creneaux]
verify_jwt = false

# Agent téléphonique — webhook d'initiation des appels Twilio (accueil personnalisé par le
# numéro appelant, spec 2026-10-04-agent-telephonique-reconnaissance-par-numero), même secret.
[functions.agent-accueil]
verify_jwt = false

# Solaire — proxy CORS PVGIS (peakpower=1 forcé serveur)
[functions.pvgis-proxy]
verify_jwt = true

# Entretiens — créneaux optimisés pour un contrat (outil machine-usable : CTA
# ContractModal aujourd'hui, serveur MCP Hermes/Vapi demain). requireOrgMembership.
[functions.slots-propose]
verify_jwt = true

# Solaire — proxy IGN LiDAR HD MNS (élévation, open data, CORS)
[functions.ign-mns-proxy]
verify_jwt = true

[functions.gsc-oauth-init]
verify_jwt = true

[functions.gsc-sync]
verify_jwt = true

# mailing-send : verify_jwt:false (2026-06-02) — auth interne (MDH_CRON_SECRET
# pour le scheduler cron OU JWT user pour le frontend). La clé service_role du
# projet est sb_secret (non-JWT) → inappelable via gateway verify_jwt:true.
[functions.mailing-send]
verify_jwt = false

[functions.contract-signed-notify]
verify_jwt = true

[functions.resend-domain-onboard]
verify_jwt = true

[functions.invite-client]
verify_jwt = true

# Sync RDV -> Google Calendar (appelée par googleCalendar.service.js)
[functions.google-calendar-sync]
verify_jwt = true

[functions.transcribe-dictation]
verify_jwt = true

# meeting-extract retiree le 2026-08-10 : elle appartient a Arpet
# (majordhome n'a aucun appelant), son source n'est pas dans ce repo, et sa
# presence ici cassait `supabase functions deploy` — l'erreur s'est produite au
# deploiement du nouveau projet. Elle etait de surcroit declaree verify_jwt=true
# alors que la prod la sert en false : un deploy global depuis ce repo vers
# l'instance partagee aurait pu la basculer et casser une app voisine.

# Tournées — figeage automatique des journées PLEINES (cron pg_cron horaire,
