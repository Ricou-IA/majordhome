[functions.pennylane-customer-push]
verify_jwt = true

# webshop-process : transitions de commande, événements de tournée, rejeu des actions
# (e-mails client par envoi, ordre colis). JWT user + requireOrgMembership + webshop_can_process.
# 2026-10-19.
[functions.webshop-process]
verify_jwt = true

[functions.company-document-extract]
verify_jwt = true

# supplier-catalog-sync : relevé du catalogue d'un fournisseur par plateforme (suitecommerce | woocommerce :
# connexion serveur avec les identifiants Vault de l'org et site_url / connector_config de la ligne suppliers),
