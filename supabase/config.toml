[functions.pennylane-invoice-import]
verify_jwt = true

[functions.invoice-send]
verify_jwt = true

[functions.maintenance-digest]
verify_jwt = false

[functions.baikal-admin]
verify_jwt = false

[functions.auto-rdv]
verify_jwt = false

[functions.auto-rdv-cron]
verify_jwt = false

